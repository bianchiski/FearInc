<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Interview Prep Trainer</title>
  <link rel="stylesheet" href="/styles.css">
  <style>
    :root { color: #e9efff; background: #080d18; font: 15px/1.5 Inter, Segoe UI, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: radial-gradient(ellipse 80% 40% at 80% -10%, #1a3560, transparent 50%), #080d18; }
    header { display: flex; justify-content: space-between; gap: 16px; align-items: center; padding: 20px 5vw; border-bottom: 1px solid #2b416a; background: #0d1628dd; }
    h1 { margin: 0; font-size: 22px; } h2 { margin: 6px 0 10px; font-size: 28px; } h3 { margin: 0 0 10px; color: #91a9d5; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; }
    main { max-width: 1240px; margin: 28px auto; padding: 0 24px; display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 24px; }
    .panel { background: linear-gradient(160deg, #17243b, #101a2c); border: 1px solid #2b416a; border-radius: 18px; padding: 18px; margin-bottom: 16px; }
    button, .item { border: 0; border-radius: 10px; background: #6e8cff; color: white; padding: 9px 12px; margin: 4px; cursor: pointer; }
    button.secondary, .item { background: #1b2d4d; color: #d5e2ff; text-align: left; }
    .item { display: block; width: calc(100% - 8px); }
    .item.active { outline: 2px solid #6e8cff; }
    textarea { width: 100%; min-height: 240px; border-radius: 12px; border: 1px solid #304a78; background: #080d17; color: #dce8ff; padding: 14px; font: 13px/1.55 Consolas, monospace; }
    pre { white-space: pre-wrap; background: #080d17; border-radius: 12px; padding: 12px; }
    details.theory { margin: 18px 0; background: #10213b; border: 1px solid #36598d; border-radius: 14px; padding: 14px 16px; }
    details.theory summary { cursor: pointer; color: #bcd1ff; font-weight: 700; }
    .theory-body { color: #d9e5ff; line-height: 1.7; }
    .theory-body h1, .theory-body h2, .theory-body h3 { color: #fff; margin-top: 18px; }
    .theory-body code { background: #080d17; padding: 2px 5px; border-radius: 4px; }
    .theory-body pre { border: 1px solid #243d67; }
    .reference-code { margin: 12px 0; }
    .reference-code summary { cursor: pointer; color: #bcd1ff; }
    .reference-code pre { overflow-x: auto; border: 1px solid #36598d; color: #dce8ff; }
    .muted { color: #8fa3c9; } .ok { color: #3dd6a0; } .bad { color: #ff8d8d; }
    .objective { color: #d9e5ff; font-size: 17px; }
    .learning-card { margin: 14px 0; padding: 12px 14px; background: #10213b; border: 1px solid #36598d; border-radius: 12px; }
    .learning-card summary { cursor: pointer; color: #bcd1ff; font-weight: 700; }
    .session-primary { width: 100%; font-weight: 700; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
    @media (max-width: 860px) { main { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
<header>
  <div><p class="eyebrow">FEARINC / INTERVIEW LAB</p><h1>Learn the why. Practice the how.</h1><p class="muted">A backend-first path from beginner fundamentals to confident interview answers.</p></div>
  <div class="header-actions"><input id="search" type="search" placeholder="Search concepts, questions…" aria-label="Search"><label class="muted"><input id="ai" type="checkbox"> AI drills</label></div>
</header>
<main>
  <aside>
    <nav class="panel nav" aria-label="Primary navigation">
      <button class="nav-button active" data-view="dashboard">Overview</button>
      <button class="nav-button" data-view="questions">Interview questions</button>
      <button class="nav-button" data-view="eli5">ELI5 library</button>
      <button class="nav-button" data-view="progress">Progress</button>
    </nav>
    <div class="panel"><h3>Today's session</h3><div id="session-content"></div></div>
    <div class="panel"><h3>Daily mixed check</h3><div id="assessment"></div></div>
    <div class="panel"><h3>Due</h3><div id="due"></div></div>
    <div class="panel"><h3>Modules</h3><div id="modules"></div></div>
    <div class="panel"><h3>Learning signals</h3><div id="summary"></div></div>
    <div class="panel"><h3>Planner</h3><div id="planner" class="muted"></div></div>
  </aside>
  <section id="work" class="panel workspace" aria-live="polite">Loading the catalog…</section>
</main>
<script type="module" src="/app.js"></script>
</body>
</html>
